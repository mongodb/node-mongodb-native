# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gitsubmodule" # See documentation for possible values
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    ignore:
      # We intentionally track the floating v4 tag so CodeQL CLI updates and
      # server-side flag changes are picked up automatically. Pinning to an exact
      # patch makes this a recurring manual chore and risks breaking when a
      # server-side flag is removed. Major bumps are still surfaced; update this
      # range when we move to v5.
      - dependency-name: "github/codeql-action"
        versions: ["4.x"]
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "monthly"
    ignore:
      # NODE-7473 moved us to chai 5; chai 6 is not yet evaluated.
      - dependency-name: "chai"
        versions: [">=6.0.0"]
      # sinon-chai 5.x+ is not yet evaluated against our chai version.
      - dependency-name: "sinon-chai"
        versions: [">=5.0.0"]
      # NODE-7616: eslint-plugin-mocha 11+ requires eslint 10 (NODE-7615).
      - dependency-name: "eslint-plugin-mocha"
        versions: [">=11.0.0"]
      # we ignore TS as a part of quarterly dependency updates.
      - dependency-name: "typescript"
      # NODE-3773: sinon 19+ breaks the srv polling unit tests
      - dependency-name: "sinon"
        versions: [">=19.0.0"]

      # ignore all peer dependencies
      - dependency-name: "@aws-sdk/credential-providers"
      - dependency-name: "@mongodb-js/zstd"
      - dependency-name: "gcp-metadata"
      - dependency-name: "kerberos"
      - dependency-name: "mongodb-client-encryption"
      - dependency-name: "snappy"
      - dependency-name: "socks"

    versioning-strategy: increase

    groups:
      prod-dependencies:
        dependency-type: "production"
        applies-to: version-updates
        update-types:
        - "minor"
        - "patch"
      development-dependencies:
        dependency-type: "development"
        applies-to: version-updates
        update-types:
        - "minor"
        - "patch"
