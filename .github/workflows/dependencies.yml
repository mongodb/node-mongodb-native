name: Check Dependencies

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Node and dependencies
        uses: mongodb-labs/drivers-github-tools/node/setup@99b1cbd729bc83bf7fc74e1b2a97fffad3d65d7b # v3.1.1
      - run: npm run check:dependencies
