on:
  push:
    branches: ['main']
  workflow_dispatch: {}

name: Build and commit documentation

permissions:
  contents: write
  pull-requests: write

jobs:
  build-docs:
    # prevent subsequent commits from triggering the job multiple times
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true

    runs-on: 'ubuntu-latest'
    
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: "Build documentation"
        uses: ./.github/actions/build_documentation

      - name: Open Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          title: 'docs: generate docs from latest main [skip-ci]'
          delete-branch: true
